<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.fl{position:relative;display:inline-grid;place-items:center;overflow:hidden;animation:fl 7s cubic-bezier(.3,1.5,.6,1) infinite both}
.fl::after{content:'';position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:var(--split,rgba(0,0,0,.32))}
@keyframes fl{0%{transform:perspective(400px) rotateX(-95deg);opacity:0}7%,100%{transform:perspective(400px) rotateX(0);opacity:1}}
.tu line,.tu path{stroke-dasharray:1;animation:draw 7s ease-out infinite both}
@keyframes draw{0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.tw line{stroke-dasharray:1;animation:draw2 3s ease-out infinite both}
@keyframes draw2{0%{stroke-dashoffset:1}12%,80%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:-1}}
.po{animation:po 7s cubic-bezier(.3,1.7,.5,1) infinite both}
@keyframes po{0%{transform:scale(.3);opacity:0}6%,100%{transform:scale(1);opacity:1}}
.ra{transform-origin:50% 0;animation:ra 7s cubic-bezier(.3,1.35,.6,1) infinite both}
@keyframes ra{0%{transform:perspective(700px) rotateX(85deg);opacity:0}7%,100%{transform:perspective(700px) rotateX(0);opacity:1}}
.gx{transform-origin:0 50%;animation:gx 7s cubic-bezier(.2,.8,.2,1) infinite both}

.up{animation:up 7s cubic-bezier(.2,.85,.25,1) infinite both}
@keyframes up{0%{transform:translateY(105%)}10%,100%{transform:translateY(0)}}
.wr{animation:wr 7s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes wr{0%{clip-path:inset(-20% 100% -20% 0)}10%,100%{clip-path:inset(-20% -5% -20% 0)}}
.dim{animation:dim 7s ease infinite both}
@keyframes dim{0%,14%{opacity:1}20%,100%{opacity:.38}}
.lf{animation:lf 7s cubic-bezier(.3,1.5,.6,1) infinite both}
@keyframes lf{0%,14%{transform:none}20%,100%{transform:translateX(14px)}}
.roll{display:block;animation:roll 20s steps(20) infinite}
@keyframes roll{to{transform:translateY(-100%)}}
.bar{transform-origin:0 50%;animation:bar 20s linear infinite}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tick{animation:tick 1s ease-out infinite}
@keyframes tick{0%{transform:scale(1.08)}40%,100%{transform:scale(1)}}
.caret{animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(-10deg)}77%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.lift{transform-box:fill-box;transform-origin:50% 100%;animation:lift 3.2s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes lift{0%{transform:translateY(40%) rotate(8deg);opacity:0}12%{opacity:1}30%{transform:translateY(-5%) rotate(-6deg)}42%{transform:translateY(0) rotate(3deg)}54%{transform:rotate(-3deg)}66%,100%{transform:rotate(0)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(18%) rotate(10deg);opacity:.45}50%{transform:translateY(0) rotate(0);opacity:1}}
.ch line{transform-box:fill-box;transform-origin:0 100%;animation:ch 3.2s ease-out infinite}
.ch line:nth-child(2){animation-delay:.08s}
.ch line:nth-child(3){animation-delay:.16s}
@keyframes ch{0%,30%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.25)}50%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
.cf{position:absolute;top:-40px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(820px) rotate(var(--r,200deg))}}
.press{animation:press 1.6s ease-out infinite}@keyframes press{0%,100%{transform:scale(1)}5%{transform:scale(.94) translateY(4px);box-shadow:inset 0 -2px 0 #b88a00,0 1px 0 #08120e}14%{transform:scale(1.03)}24%{transform:scale(1)}}.fly{position:absolute;bottom:255px;opacity:0;animation:fly 1.6s cubic-bezier(.2,.7,.3,1) infinite}@keyframes fly{0%,4%{opacity:0;transform:translateY(0) scale(.5) rotate(0)}12%{opacity:1;transform:translateY(-30px) scale(1) rotate(var(--r))}70%{opacity:0;transform:translateY(-150px) scale(.9) rotate(calc(var(--r) * -1))}100%{opacity:0}}.bump{display:inline-block;animation:bump 1.6s ease-out infinite}@keyframes bump{0%,100%{transform:none}8%{transform:scale(1.18);color:#f2b705}22%{transform:none}}.refill line{stroke-dasharray:1;animation:refill 2.4s linear infinite}@keyframes refill{0%{stroke-dashoffset:1}85%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
