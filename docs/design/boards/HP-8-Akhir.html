<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HP Game selesai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.fl{position:relative;display:inline-grid;place-items:center;overflow:hidden;animation:fl 7s cubic-bezier(.3,1.5,.6,1) infinite both}
.fl::after{content:'';position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:var(--split,rgba(0,0,0,.32))}
@keyframes fl{0%{transform:perspective(400px) rotateX(-95deg);opacity:0}7%,100%{transform:perspective(400px) rotateX(0);opacity:1}}
.tu line,.tu path{stroke-dasharray:1;animation:draw 7s ease-out infinite both}
@keyframes draw{0%{stroke-dashoffset:1}4%,100%{stroke-dashoffset:0}}
.tw line{stroke-dasharray:1;animation:draw2 3s ease-out infinite both}
@keyframes draw2{0%{stroke-dashoffset:1}12%,80%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:-1}}
.po{animation:po 7s cubic-bezier(.3,1.7,.5,1) infinite both}
@keyframes po{0%{transform:scale(.3);opacity:0}6%,100%{transform:scale(1);opacity:1}}
.ra{transform-origin:50% 0;animation:ra 7s cubic-bezier(.3,1.35,.6,1) infinite both}
@keyframes ra{0%{transform:perspective(700px) rotateX(85deg);opacity:0}7%,100%{transform:perspective(700px) rotateX(0);opacity:1}}
.gx{transform-origin:0 50%;animation:gx 7s cubic-bezier(.2,.8,.2,1) infinite both}
@keyframes gx{0%{transform:scaleX(0)}11%,100%{transform:scaleX(1)}}
.up{animation:up 7s cubic-bezier(.2,.85,.25,1) infinite both}
@keyframes up{0%{transform:translateY(105%)}10%,100%{transform:translateY(0)}}
.wr{animation:wr 7s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes wr{0%{clip-path:inset(-20% 100% -20% 0)}10%,100%{clip-path:inset(-20% -5% -20% 0)}}
.dim{animation:dim 7s ease infinite both}
@keyframes dim{0%,14%{opacity:1}20%,100%{opacity:.38}}
.lf{animation:lf 7s cubic-bezier(.3,1.5,.6,1) infinite both}
@keyframes lf{0%,14%{transform:none}20%,100%{transform:translateX(14px)}}
.roll{display:block;animation:roll 20s steps(20) infinite}
@keyframes roll{to{transform:translateY(-100%)}}
.bar{transform-origin:0 50%;animation:bar 20s linear infinite}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tick{animation:tick 1s ease-out infinite}
@keyframes tick{0%{transform:scale(1.08)}40%,100%{transform:scale(1)}}
.caret{animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,55%,100%{transform:rotate(0)}66%{transform:rotate(-10deg)}77%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.lift{transform-box:fill-box;transform-origin:50% 100%;animation:lift 3.2s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes lift{0%{transform:translateY(40%) rotate(8deg);opacity:0}12%{opacity:1}30%{transform:translateY(-5%) rotate(-6deg)}42%{transform:translateY(0) rotate(3deg)}54%{transform:rotate(-3deg)}66%,100%{transform:rotate(0)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(18%) rotate(10deg);opacity:.45}50%{transform:translateY(0) rotate(0);opacity:1}}
.ch line{transform-box:fill-box;transform-origin:0 100%;animation:ch 3.2s ease-out infinite}
.ch line:nth-child(2){animation-delay:.08s}
.ch line:nth-child(3){animation-delay:.16s}
@keyframes ch{0%,30%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.25)}50%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}
.cf{position:absolute;top:-40px;border-radius:3px;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(820px) rotate(var(--r,200deg))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#14261f;color:#eef3ee;font-family:'Plus Jakarta Sans','Segoe UI',sans-serif;padding:52px 20px 24px;display:flex;flex-direction:column;"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:6px"><svg viewBox="0 0 120 120" width="28" height="28" aria-hidden="true" style="flex:none;color:#f2b705;overflow:visible"><g transform="rotate(-8 64 64)"><g class="" fill="currentColor"><rect x="36" y="22" width="13" height="50" rx="6.5"></rect><rect x="52" y="10" width="13" height="62" rx="6.5"></rect><rect x="68" y="14" width="13" height="58" rx="6.5"></rect><rect x="84" y="26" width="13" height="46" rx="6.5"></rect><path d="M36 56 H97 V80 C97 92 89 99 78 99 H55 C44 99 36 92 36 81 Z"></path><line x1="42" y1="80" x2="23" y2="58" stroke="currentColor" stroke-width="13" stroke-linecap="round"></line><rect x="47" y="103" width="40" height="15" rx="4" fill="#eef3ee"></rect></g></g></svg><span style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:26px;line-height:.85;color:#eef3ee">sorak</span></div><span style="font-size:14px;font-weight:700;color:#a9bab0">Geografi Sumatra</span></div><p style="margin-top:34px;font-size:16px;font-weight:700;color:#a9bab0">Game selesai. Peringkatmu</p><div style="margin-top:12px;display:flex;align-items:flex-end;gap:16px"><div style="display:flex;gap:6px;align-items:center"><span class="fl" style="--split:rgba(0,0,0,.25);animation-delay:0.15s;width:120px;height:150px;border-radius:16px;background:#f2b705;color:#15211b;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:140px;line-height:1;">4</span></div><div style="padding-bottom:6px"><p style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:40px;line-height:.9">dari 27</p><p style="margin-top:6px;font-size:16px;font-weight:700;color:#a9bab0">3.210 poin</p></div></div><div style="margin-top:30px;border-radius:14px;overflow:hidden"><div class="up" style="animation-delay:.6s;background:#f5f7f4;color:#15211b;padding:16px 18px 18px 30px;background-image:linear-gradient(90deg,transparent 17px,#e7a9ac 17px,#e7a9ac 19px,transparent 19px),repeating-linear-gradient(180deg,transparent 0 35px,#dde6ee 35px 36px);background-position:0 8px"><p style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:28px;line-height:1">Rapor kuismu</p><div class="wr" style="animation-delay:1.00s;display:flex;justify-content:space-between;gap:12px;height:36px;align-items:flex-end;padding-bottom:6px;font-size:15px"><span style="color:#4c5b53">Jawaban benar</span><span style="font-weight:800;text-align:right">8 dari 10</span></div><div class="wr" style="animation-delay:1.22s;display:flex;justify-content:space-between;gap:12px;height:36px;align-items:flex-end;padding-bottom:6px;font-size:15px"><span style="color:#4c5b53">Kombo terpanjang</span><span style="font-weight:800;text-align:right">5 soal</span></div><div class="wr" style="animation-delay:1.44s;display:flex;justify-content:space-between;gap:12px;height:36px;align-items:flex-end;padding-bottom:6px;font-size:15px"><span style="color:#4c5b53">Jawaban tercepat</span><span style="font-weight:800;text-align:right">2,1 detik di soal 6</span></div><div class="wr" style="animation-delay:1.66s;display:flex;justify-content:space-between;gap:12px;height:36px;align-items:flex-end;padding-bottom:6px;font-size:15px"><span style="color:#4c5b53">Soal tersulit yang kamu jawab benar</span><span style="font-weight:800;text-align:right">Soal 9</span></div></div></div><div style="margin-top:auto;height:60px;border-radius:16px;background:#f2b705;color:#15211b;box-shadow:inset 0 -4px 0 #b88a00;display:grid;place-items:center;font-size:18px;font-weight:800">Main kuis lain</div><p style="margin-top:16px;text-align:center;font-size:14px;font-weight:700;color:#a9bab0">Selesai</p></div>
</body>
</html>
